[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kahvibot"
version = "0.3.0"
description = "Coffee measurement for the Guild of Physics guild room: Telegram bot, camera reader, and smart-plug power logging"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

# The bot itself, which is what runs on the Raspberry Pi as kahvibot.service.
# Deliberately small: the Pi has 909 MB of RAM and a marginal 5 V rail, so
# everything optional lives behind an extra below.
dependencies = [
    "python-telegram-bot>=13,<14",
    "pillow>=9",
]

[project.optional-dependencies]
# The camera reader and its resident service (reader/). ONNX Runtime rather than
# torch: measured on identical inputs it is 4.8x smaller resident and 2.1x
# faster, which is what makes it fit on the Pi at all.
reader = [
    "onnxruntime>=1.16",
    "numpy>=1.23",
    "pillow>=9",
    "paho-mqtt>=2",
]

# The smart-plug logger and its own bot (power/).
power = [
    "paho-mqtt>=2",
    "pandas>=1.5",
    "matplotlib>=3.5",
    "numpy>=1.23",
]

# The simulator and benchmarks (reader/gym/). Desktop only - never install this
# on the Pi. Replays archived frames through the pipeline and scores checkpoints.
gym = [
    "kahvibot[reader]",
    "matplotlib>=3.5",
    "psutil>=5.9",
]

# Fitting the density head on a frozen backbone (reader/training/). Needs torch,
# and needs the research checkout for the frame archive and hand-click labels;
# point COFFEE_RESEARCH_DIR at it.
training = [
    "kahvibot[gym]",
    "torch>=2.0",
]

dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/fyysikkokilta/kahvibot"

# The bot is a script, not a package, and the reader is deployed by copying the
# tree next to its model bundle. Declaring the modules here keeps an editable
# install honest without forcing an import-path rewrite of code that already
# runs in production.
[tool.setuptools]
py-modules = ["banner", "triggers", "graphs", "feedback"]

[tool.setuptools.packages.find]
include = ["reader*"]
exclude = ["reader.gym*", "reader.training*"]

[tool.pytest.ini_options]
testpaths = ["test_triggers.py", "test_banner.py", "reader/pipeline", "power/tests"]
# Each component is deployed as a directory of scripts, not as an installed
# package, so the suites import their neighbours by bare name. Putting those
# directories on the path lets the whole repo be tested with one command
# without rewriting imports that work in production.
pythonpath = [".", "power", "reader"]
addopts = "-q"
